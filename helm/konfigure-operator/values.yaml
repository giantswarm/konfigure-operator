# Deployment
image:
  registry: gsoci.azurecr.io
  name: "giantswarm/konfigure-operator"
  tag: ""
  pullPolicy: IfNotPresent

# Additional command-line arguments to pass to the manager container, e.g.:
#   extraArgs:
#     - --schema-fetch-timeout=10s
extraArgs: []

# Namespaces whose Konfigurations are reconciled. Konfigurations in every other namespace are
# refused with reason NamespaceNotAllowed, because the operator renders them with the platform
# SOPS keys. Only list namespaces where everyone who can create a Konfiguration may also read
# every Secret the operator can decrypt.
privilegedNamespaces:
  - giantswarm
  - flux-giantswarm

resources:
  limits:
    cpu: 150m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 64Mi

volumes:
  cache:
    sizeLimit: 32Mi
  sopsenv:
    sizeLimit: 2Mi
  temp:
    sizeLimit: 4Mi

# Vertical pod autoscaler
verticalPodAutoscaler:
  enabled: false

# Pod securityContext
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Container securityContext
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  privileged: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Prometheus
metrics:
  podMonitor:
    enabled: true
    interval: "60s"
    scrapeTimeout: "45s"

# Cilium
cilium:
  enforce: false
